name: Release

on:
  push:
    branches: [main]

# Needed for the Changesets action to open the "Version Packages" PR
# and for npm Trusted Publishing (OIDC) — no long-lived npm token required.
permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Install pnpm before setup-node so the pnpm store cache can be resolved.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Opens/updates a "Version Packages" PR when changesets are pending.
      # When that PR is merged (versions bumped, changesets consumed), the same
      # action runs `pnpm release` to build and publish to npm.
      #
      # Publishing uses npm Trusted Publishing (OIDC): npm authenticates via the
      # workflow's id-token instead of a stored NPM_TOKEN, and attaches build
      # provenance automatically. The publisher must be configured once on
      # npmjs.com for each package (see docs/04-release/first-release-checklist.md).
      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
